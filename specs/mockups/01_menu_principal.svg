<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Fondo de la "mesa" fuera del teléfono -->
  <rect width="400" height="700" fill="#0F172A"/>

  <!-- Sombra del teléfono -->
  <rect x="44" y="46" width="320" height="620" rx="32" fill="#000000" opacity="0.4"/>
  <rect x="42" y="44" width="320" height="620" rx="32" fill="#000000" opacity="0.25"/>

  <!-- Cuerpo del teléfono -->
  <rect x="40" y="40" width="320" height="620" rx="32" fill="#1F2937"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="none" stroke="#111827" stroke-width="2"/>

  <!-- Bisel interno (marco de la pantalla) -->
  <rect x="52" y="52" width="296" height="596" rx="20" fill="#000000"/>

  <!-- Pantalla (blanca) -->
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#FFFFFF"/>

  <!-- Altavoz superior -->
  <rect x="170" y="42" width="60" height="5" rx="2.5" fill="#374151"/>
  <!-- Cámara frontal -->
  <circle cx="245" cy="44.5" r="3.5" fill="#111827"/>
  <circle cx="245" cy="44.5" r="1.5" fill="#1E3A8A"/>

  <!-- Indicador home inferior -->
  <rect x="170" y="640" width="60" height="4" rx="2" fill="#4B5563"/>

  <!-- Botones laterales (volumen izq, power der) -->
  <rect x="38" y="170" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="38" y="210" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="360" y="190" width="2" height="50" rx="1" fill="#374151"/>

  <!-- ============ CONTENIDO DE LA PANTALLA ============ -->

  <!-- Status bar interno -->
  <text x="68" y="80" font-size="12" font-weight="700" fill="#1F2937">10:42</text>
  <!-- Icono señal -->
  <rect x="290" y="72" width="3" height="6" fill="#1F2937"/>
  <rect x="295" y="69" width="3" height="9" fill="#1F2937"/>
  <rect x="300" y="66" width="3" height="12" fill="#1F2937"/>
  <rect x="305" y="63" width="3" height="15" fill="#E5E7EB"/>
  <!-- Icono batería -->
  <rect x="318" y="66" width="20" height="10" rx="2" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="320" y="68" width="15" height="6" rx="1" fill="#10B981"/>
  <rect x="338" y="69" width="2" height="4" fill="#1F2937"/>

  <!-- Logo del juego -->
  <rect x="148" y="130" width="104" height="104" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <rect x="178" y="156" width="44" height="52" rx="8" fill="#2563EB"/>
  <circle cx="200" cy="202" r="3" fill="#FFFFFF"/>

  <!-- Título -->
  <text x="200" y="275" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">CLIC SEGURO</text>
  <text x="200" y="297" text-anchor="middle" font-size="12" fill="#6B7280">Cada clic tiene consecuencias</text>

  <!-- Campo de nombre -->
  <text x="74" y="340" font-size="11" font-weight="700" fill="#6B7280">TU NOMBRE</text>
  <rect x="74" y="348" width="252" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="88" y="374" font-size="14" fill="#1F2937">Camilo</text>

  <!-- Botón Jugar (destacado) -->
  <rect x="74" y="410" width="252" height="48" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="200" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#1E40AF">Jugar</text>

  <!-- Botón Instrucciones -->
  <rect x="74" y="470" width="252" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="200" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Instrucciones</text>

  <!-- Botón Créditos -->
  <rect x="74" y="522" width="252" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="200" y="548" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Créditos</text>

  <!-- Botón Salir -->
  <rect x="74" y="574" width="252" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="200" y="600" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Salir</text>

  <!-- Footer dentro de la pantalla -->
  <text x="200" y="634" text-anchor="middle" font-size="10" fill="#9CA3AF">Proyecto de aula · Programación III</text>
</svg>