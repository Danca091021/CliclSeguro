<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="400" height="700" fill="#0F172A"/>
  <rect x="44" y="46" width="320" height="620" rx="32" fill="#000000" opacity="0.4"/>
  <rect x="42" y="44" width="320" height="620" rx="32" fill="#000000" opacity="0.25"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="#1F2937"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="none" stroke="#111827" stroke-width="2"/>
  <rect x="52" y="52" width="296" height="596" rx="20" fill="#000000"/>
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#FFFFFF"/>
  <rect x="170" y="42" width="60" height="5" rx="2.5" fill="#374151"/>
  <circle cx="245" cy="44.5" r="3.5" fill="#111827"/>
  <circle cx="245" cy="44.5" r="1.5" fill="#1E3A8A"/>
  <rect x="170" y="640" width="60" height="4" rx="2" fill="#4B5563"/>
  <rect x="38" y="170" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="38" y="210" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="360" y="190" width="2" height="50" rx="1" fill="#374151"/>

  <!-- ===== STATUS BAR (layout corregido) ===== -->
  <text x="68" y="80" font-size="12" font-weight="700" fill="#1F2937">Miércoles 15:30</text>
  <text x="200" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">195 pts</text>
  <rect x="256" y="72" width="3" height="6" fill="#1F2937"/>
  <rect x="261" y="69" width="3" height="9" fill="#1F2937"/>
  <rect x="266" y="66" width="3" height="12" fill="#1F2937"/>
  <rect x="271" y="63" width="3" height="15" fill="#E5E7EB"/>
  <rect x="284" y="66" width="22" height="10" rx="2" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="286" y="68" width="17" height="6" rx="1" fill="#10B981"/>
  <rect x="306" y="69" width="2" height="4" fill="#1F2937"/>

  <!-- ===== HEADER DERRROTA ===== -->
  <!-- Fondo rojo suave de alerta -->
  <rect x="54" y="92" width="292" height="140" fill="#FEF2F2"/>
  <rect x="54" y="92" width="292" height="4" fill="#EF4444"/>

  <!-- Ícono grande -->
  <circle cx="200" cy="145" r="32" fill="#FEE2E2"/>
  <circle cx="200" cy="145" r="22" fill="#EF4444"/>
  <line x1="192" y1="137" x2="208" y2="153" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="208" y1="137" x2="192" y2="153" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <text x="200" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#991B1B">Fin del nivel</text>
  <text x="200" y="220" text-anchor="middle" font-size="11" fill="#7F1D1D">Tu privacidad llegó a 0</text>

  <!-- ===== CUERPO ===== -->
  <rect x="68" y="248" width="264" height="380" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Estado de barras compacto -->
  <text x="85" y="272" font-size="9" font-weight="700" fill="#6B7280">ESTADO FINAL</text>

  <text x="85" y="292" font-size="10" fill="#1F2937">Privacidad</text>
  <text x="315" y="292" text-anchor="end" font-size="10" font-weight="700" fill="#DC2626">0</text>
  <rect x="160" y="285" width="150" height="6" rx="3" fill="#E5E7EB"/>
  <!-- Barra vacía, sin fill -->

  <text x="85" y="310" font-size="10" fill="#1F2937">Saldo</text>
  <text x="315" y="310" text-anchor="end" font-size="10" font-weight="700" fill="#1F2937">$400.000</text>
  <rect x="160" y="303" width="150" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="160" y="303" width="120" height="6" rx="3" fill="#2563EB"/>

  <text x="85" y="328" font-size="10" fill="#1F2937">Reputación</text>
  <text x="315" y="328" text-anchor="end" font-size="10" font-weight="700" fill="#1F2937">60</text>
  <rect x="160" y="321" width="150" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="160" y="321" width="90" height="6" rx="3" fill="#F59E0B"/>

  <line x1="85" y1="345" x2="315" y2="345" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Qué pasó (narrativa) -->
  <text x="85" y="368" font-size="9" font-weight="700" fill="#6B7280">QUÉ PASÓ</text>

  <text x="85" y="388" font-size="12" fill="#1F2937">Entregaste tu código de</text>
  <text x="85" y="405" font-size="12" fill="#1F2937">verificación. El estafador</text>
  <text x="85" y="422" font-size="12" fill="#1F2937">tomó tu WhatsApp y ahora</text>
  <text x="85" y="439" font-size="12" fill="#1F2937">escribe a tus contactos</text>
  <text x="85" y="456" font-size="12" fill="#1F2937">haciéndose pasar por ti.</text>

  <line x1="85" y1="472" x2="315" y2="472" stroke="#E5E7EB" stroke-width="1"/>

  <!-- La lección -->
  <text x="85" y="494" font-size="9" font-weight="700" fill="#6B7280">LO QUE APRENDISTE</text>

  <rect x="85" y="504" width="230" height="72" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <polygon points="100,520 110,540 90,540" fill="#F59E0B"/>
  <text x="100" y="536" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">!</text>
  <text x="118" y="524" font-size="11" font-weight="700" fill="#92400E">El código OTP nunca se comparte</text>
  <text x="118" y="540" font-size="10" fill="#78350F">Ninguna empresa legítima te lo pedirá.</text>
  <text x="118" y="554" font-size="10" fill="#78350F">Si lo piden, es una estafa.</text>
  <text x="118" y="568" font-size="9" fill="#B45309" font-style="italic">→ Guardado en "Aprendizajes"</text>

  <!-- Botón principal: repetir -->
  <rect x="85" y="586" width="230" height="32" rx="8" fill="#2563EB"/>
  <text x="200" y="607" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Repetir el miércoles</text>

  <!-- Botón secundario: menú -->
  <text x="200" y="631" text-anchor="middle" font-size="10" font-weight="600" fill="#6B7280">Volver al menú principal</text>
</svg>