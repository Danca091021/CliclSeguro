<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Fondo mesa -->
  <rect width="400" height="700" fill="#0F172A"/>

  <!-- Sombra -->
  <rect x="44" y="46" width="320" height="620" rx="32" fill="#000000" opacity="0.4"/>
  <rect x="42" y="44" width="320" height="620" rx="32" fill="#000000" opacity="0.25"/>

  <!-- Cuerpo -->
  <rect x="40" y="40" width="320" height="620" rx="32" fill="#1F2937"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="none" stroke="#111827" stroke-width="2"/>

  <!-- Bisel -->
  <rect x="52" y="52" width="296" height="596" rx="20" fill="#000000"/>

  <!-- Pantalla -->
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#F9FAFB"/>

  <!-- Altavoz / cámara -->
  <rect x="170" y="42" width="60" height="5" rx="2.5" fill="#374151"/>
  <circle cx="245" cy="44.5" r="3.5" fill="#111827"/>
  <circle cx="245" cy="44.5" r="1.5" fill="#1E3A8A"/>

  <!-- Home indicator -->
  <rect x="170" y="640" width="60" height="4" rx="2" fill="#4B5563"/>

  <!-- Botones laterales -->
  <rect x="38" y="170" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="38" y="210" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="360" y="190" width="2" height="50" rx="1" fill="#374151"/>

  <!-- ===== STATUS BAR ===== -->
  <text x="68" y="80" font-size="12" font-weight="700" fill="#1F2937">Miércoles 10:44</text>
  <text x="310" y="80" text-anchor="end" font-size="11" font-weight="700" fill="#6B7280">60 pts</text>
  <!-- señal -->
  <rect x="256" y="72" width="3" height="6" fill="#1F2937"/>
  <rect x="261" y="69" width="3" height="9" fill="#1F2937"/>
  <rect x="266" y="66" width="3" height="12" fill="#1F2937"/>
  <rect x="271" y="63" width="3" height="15" fill="#E5E7EB"/>
  <!-- batería -->
  <rect x="284" y="66" width="22" height="10" rx="2" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="286" y="68" width="17" height="6" rx="1" fill="#10B981"/>
  <rect x="306" y="69" width="2" height="4" fill="#1F2937"/>

  <!-- ===== HEADER PANEL ===== -->
  <!-- Banda superior con gradiente suave simulado -->
  <rect x="54" y="92" width="292" height="80" fill="#FEF3C7"/>
  <rect x="54" y="92" width="292" height="80" fill="#FBBF24" opacity="0.15"/>

  <!-- Ícono grande de "Consejo" (bombilla) -->
  <circle cx="100" cy="132" r="26" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="100" cy="126" r="10" fill="#FBBF24"/>
  <path d="M 94 132 L 106 132 L 104 140 L 96 140 Z" fill="#FBBF24"/>
  <rect x="97" y="140" width="6" height="3" fill="#F59E0B"/>
  <rect x="98" y="144" width="4" height="2" fill="#F59E0B"/>

  <!-- Rays -->
  <line x1="100" y1="96" x2="100" y2="100" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="106" x2="83" y2="109" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="106" x2="117" y2="109" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="126" x2="80" y2="126" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="124" y1="126" x2="120" y2="126" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Título del panel -->
  <text x="140" y="122" font-size="15" font-weight="700" fill="#92400E">El Consejo de Camilo</text>
  <text x="140" y="140" font-size="10" fill="#78350F">Aprende lo que pasó y por qué</text>

  <!-- Indicador de reproducción TTS -->
  <rect x="140" y="150" width="120" height="16" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <!-- icono de altavoz -->
  <path d="M 148 155 L 151 155 L 154 152 L 154 164 L 151 161 L 148 161 Z" fill="#F59E0B"/>
  <path d="M 156 155 Q 159 158 156 161" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 158 152 Q 163 158 158 164" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Ondas animadas -->
  <rect x="166" y="156" width="2" height="4" fill="#F59E0B" opacity="0.9"/>
  <rect x="170" y="154" width="2" height="8" fill="#F59E0B" opacity="0.9"/>
  <rect x="174" y="152" width="2" height="12" fill="#F59E0B" opacity="0.9"/>
  <rect x="178" y="155" width="2" height="6" fill="#F59E0B" opacity="0.6"/>
  <rect x="182" y="153" width="2" height="10" fill="#F59E0B" opacity="0.8"/>
  <rect x="186" y="156" width="2" height="4" fill="#F59E0B" opacity="0.5"/>
  <!-- Texto "Reproduciendo..." -->
  <text x="196" y="161" font-size="9" font-weight="600" fill="#92400E">Reproduciendo…</text>

  <!-- ===== CUERPO DEL PANEL ===== -->
  <rect x="68" y="188" width="264" height="380" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Categoría del ataque -->
  <text x="85" y="212" font-size="9" font-weight="700" fill="#6B7280">TIPO DE ATAQUE</text>
  <rect x="85" y="220" width="120" height="22" rx="11" fill="#FEE2E2"/>
  <circle cx="98" cy="231" r="4" fill="#EF4444"/>
  <text x="108" y="235" font-size="11" font-weight="700" fill="#991B1B">Ingeniería social</text>

  <line x1="85" y1="258" x2="315" y2="258" stroke="#E5E7EB" stroke-width="1"/>

  <!-- TÍTULO del consejo (typewriter simulado con cursor) -->
  <text x="85" y="285" font-size="15" font-weight="700" fill="#1F2937">El código OTP nunca se comparte</text>
  <!-- Cursor de typewriter (parpadeante) -->
  <rect x="303" y="272" width="2" height="16" fill="#2563EB" opacity="0.8"/>

  <line x1="85" y1="300" x2="315" y2="300" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Cuerpo del texto (con typewriter visual) -->
  <text x="85" y="325" font-size="12" fill="#374151">Ninguna empresa legítima te pedirá</text>
  <text x="85" y="345" font-size="12" fill="#374151">el código de 6 dígitos que llega a</text>
  <text x="85" y="365" font-size="12" fill="#374151">tu celular. Ese código es tu llave</text>
  <text x="85" y="385" font-size="12" fill="#374151">personal: quien lo recibe, entra a</text>
  <text x="85" y="405" font-size="12" fill="#374151">tu cuenta.</text>

  <!-- Énfasis -->
  <text x="85" y="428" font-size="12" font-weight="700" fill="#DC2626">Si alguien lo pide, es una estafa.</text>

  <line x1="85" y1="445" x2="315" y2="445" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Qué hacer en el futuro -->
  <text x="85" y="468" font-size="9" font-weight="700" fill="#6B7280">QUÉ HACER LA PRÓXIMA VEZ</text>

  <circle cx="92" cy="486" r="4" fill="#10B981"/>
  <text x="104" y="490" font-size="11" fill="#1F2937">Cuelga o ignora la solicitud</text>

  <circle cx="92" cy="508" r="4" fill="#10B981"/>
  <text x="104" y="512" font-size="11" fill="#1F2937">Reporta el número como fraude</text>

  <circle cx="92" cy="530" r="4" fill="#10B981"/>
  <text x="104" y="534" font-size="11" fill="#1F2937">Cuéntale a alguien de confianza</text>

  <!-- Guardado en Aprendizajes -->
  <rect x="85" y="548" width="230" height="20" rx="10" fill="#ECFDF5"/>
  <text x="200" y="562" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">✓ Guardado en "Aprendizajes"</text>

  <!-- ===== FOOTER: BOTÓN ===== -->
  <rect x="85" y="588" width="230" height="46" rx="8" fill="#2563EB"/>
  <text x="200" y="616" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Entendido</text>

  <!-- Nota de auto-TTS -->
  <text x="200" y="650" text-anchor="middle" font-size="9" fill="#9CA3AF" font-style="italic">Se lee automáticamente · Puedes cerrarlo antes</text>
</svg>