<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Fondo mesa -->
  <rect width="400" height="700" fill="#0F172A"/>

  <!-- Sombra -->
  <rect x="44" y="46" width="320" height="620" rx="32" fill="#000000" opacity="0.4"/>
  <rect x="42" y="44" width="320" height="620" rx="32" fill="#000000" opacity="0.25"/>

  <!-- Cuerpo -->
  <rect x="40" y="40" width="320" height="620" rx="32" fill="#1F2937"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="none" stroke="#111827" stroke-width="2"/>

  <!-- Bisel -->
  <rect x="52" y="52" width="296" height="596" rx="20" fill="#000000"/>

  <!-- Pantalla -->
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#F9FAFB"/>

  <!-- Altavoz / cámara -->
  <rect x="170" y="42" width="60" height="5" rx="2.5" fill="#374151"/>
  <circle cx="245" cy="44.5" r="3.5" fill="#111827"/>
  <circle cx="245" cy="44.5" r="1.5" fill="#1E3A8A"/>

  <!-- Home indicator -->
  <rect x="170" y="640" width="60" height="4" rx="2" fill="#4B5563"/>

  <!-- Botones laterales -->
  <rect x="38" y="170" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="38" y="210" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="360" y="190" width="2" height="50" rx="1" fill="#374151"/>

  <!-- ===== STATUS BAR ===== -->
  <text x="68" y="80" font-size="12" font-weight="700" fill="#1F2937">Lunes 08:15</text>
  <text x="240" y="80" text-anchor="end" font-size="11" font-weight="700" fill="#6B7280">0 pts</text>
  <!-- señal -->
  <rect x="256" y="72" width="3" height="6" fill="#1F2937"/>
  <rect x="261" y="69" width="3" height="9" fill="#1F2937"/>
  <rect x="266" y="66" width="3" height="12" fill="#1F2937"/>
  <rect x="271" y="63" width="3" height="15" fill="#E5E7EB"/>
  <!-- batería -->
  <rect x="284" y="66" width="22" height="10" rx="2" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="286" y="68" width="17" height="6" rx="1" fill="#10B981"/>
  <rect x="306" y="69" width="2" height="4" fill="#1F2937"/>

  <!-- ===== GREETING ===== -->
  <text x="68" y="115" font-size="11" fill="#6B7280">Buenos días,</text>
  <text x="68" y="138" font-size="22" font-weight="700" fill="#1F2937">Camilo</text>

  <!-- ===== WIDGET DE SEMANA ===== -->
  <rect x="68" y="152" width="264" height="62" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="80" y="170" font-size="10" font-weight="700" fill="#6B7280">TU SEMANA</text>

  <!-- Dots L M X J V -->
  <circle cx="100" cy="192" r="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="100" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">L</text>
  <circle cx="126" cy="192" r="8" fill="#E5E7EB"/>
  <text x="126" y="196" text-anchor="middle" font-size="10" fill="#6B7280">M</text>
  <circle cx="152" cy="192" r="8" fill="#E5E7EB"/>
  <text x="152" y="196" text-anchor="middle" font-size="10" fill="#6B7280">X</text>
  <circle cx="178" cy="192" r="8" fill="#E5E7EB"/>
  <text x="178" y="196" text-anchor="middle" font-size="10" fill="#6B7280">J</text>
  <circle cx="204" cy="192" r="8" fill="#E5E7EB"/>
  <text x="204" y="196" text-anchor="middle" font-size="10" fill="#6B7280">V</text>

  <text x="230" y="188" font-size="11" font-weight="700" fill="#1F2937">3 nuevas</text>
  <text x="230" y="202" font-size="9" fill="#6B7280">notificaciones</text>

  <!-- ===== GRID APPS ===== -->
  <text x="68" y="238" font-size="10" font-weight="700" fill="#6B7280">APLICACIONES</text>

  <!-- Fila 1: Contactos, Ajustes, CAI, Correo -->
  <rect x="68" y="248" width="44" height="44" rx="12" fill="#F59E0B"/>
  <circle cx="90" cy="265" r="6" fill="#FFFFFF"/>
  <path d="M 78 287 Q 78 277 90 277 Q 102 277 102 287 Z" fill="#FFFFFF"/>
  <text x="90" y="306" text-anchor="middle" font-size="10" fill="#1F2937">Contactos</text>

  <rect x="133" y="248" width="44" height="44" rx="12" fill="#6B7280"/>
  <circle cx="155" cy="270" r="9" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="155" cy="270" r="3" fill="#FFFFFF"/>
  <text x="155" y="306" text-anchor="middle" font-size="10" fill="#1F2937">Ajustes</text>

  <rect x="198" y="248" width="44" height="44" rx="12" fill="#DC2626"/>
  <path d="M 220 256 L 232 262 L 232 274 Q 232 284 220 288 Q 208 284 208 274 L 208 262 Z" fill="#FFFFFF"/>
  <text x="220" y="306" text-anchor="middle" font-size="10" fill="#1F2937">CAI</text>

  <rect x="263" y="248" width="44" height="44" rx="12" fill="#3B82F6"/>
  <rect x="270" y="262" width="30" height="18" rx="2" fill="#FFFFFF"/>
  <path d="M 270 264 L 285 274 L 300 264" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
  <text x="285" y="306" text-anchor="middle" font-size="10" fill="#1F2937">Correo</text>

  <!-- Fila 2: Fotos, Calendario, Música -->
  <rect x="68" y="328" width="44" height="44" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="90" cy="340" r="6" fill="#EF4444"/>
  <circle cx="90" cy="360" r="6" fill="#3B82F6"/>
  <circle cx="80" cy="350" r="6" fill="#F59E0B"/>
  <circle cx="100" cy="350" r="6" fill="#10B981"/>
  <circle cx="90" cy="350" r="3" fill="#FFFFFF"/>
  <text x="90" y="386" text-anchor="middle" font-size="10" fill="#1F2937">Fotos</text>

  <rect x="133" y="328" width="44" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="133" y="328" width="44" height="12" rx="10" fill="#EF4444"/>
  <rect x="133" y="335" width="44" height="5" fill="#EF4444"/>
  <text x="155" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">12</text>
  <text x="155" y="386" text-anchor="middle" font-size="10" fill="#1F2937">Calendario</text>

  <rect x="198" y="328" width="44" height="44" rx="12" fill="#EC4899"/>
  <circle cx="214" cy="358" r="4" fill="#FFFFFF"/>
  <circle cx="228" cy="356" r="4" fill="#FFFFFF"/>
  <rect x="217" y="340" width="2" height="18" fill="#FFFFFF"/>
  <rect x="231" y="338" width="2" height="18" fill="#FFFFFF"/>
  <rect x="217" y="340" width="14" height="2" fill="#FFFFFF"/>
  <text x="220" y="386" text-anchor="middle" font-size="10" fill="#1F2937">Música</text>

  <!-- ===== DOCK ===== -->
  <rect x="62" y="415" width="276" height="86" rx="22" fill="#FFFFFF" opacity="0.75"/>
  <rect x="62" y="415" width="276" height="86" rx="22" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Mensajería con badge -->
  <rect x="78" y="436" width="44" height="44" rx="12" fill="#25D366"/>
  <path d="M 92 465 Q 92 452 100 452 Q 108 452 108 465 Q 108 471 100 471 L 95 471 Z" fill="#FFFFFF"/>
  <circle cx="116" cy="437" r="8" fill="#EF4444"/>
  <text x="116" y="441" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">3</text>
  <text x="100" y="495" text-anchor="middle" font-size="9" fill="#1F2937">Mensajes</text>

  <!-- Llamadas -->
  <rect x="143" y="436" width="44" height="44" rx="12" fill="#34D399"/>
  <path d="M 155 452 Q 152 454 155 460 Q 158 466 165 468 Q 170 469 171 464 L 167 460 L 162 462 Q 159 460 158 456 L 161 452 Z" fill="#FFFFFF"/>
  <text x="165" y="495" text-anchor="middle" font-size="9" fill="#1F2937">Llamadas</text>

  <!-- Instagram -->
  <rect x="208" y="436" width="44" height="44" rx="12" fill="#E1306C"/>
  <rect x="217" y="445" width="26" height="26" rx="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="230" cy="458" r="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="238" cy="450" r="1.5" fill="#FFFFFF"/>
  <text x="230" y="495" text-anchor="middle" font-size="9" fill="#1F2937">Instagram</text>

  <!-- Banco -->
  <rect x="273" y="436" width="44" height="44" rx="12" fill="#2563EB"/>
  <text x="295" y="466" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">$</text>
  <text x="295" y="495" text-anchor="middle" font-size="9" fill="#1F2937">Banco</text>

  <!-- Footer dentro de pantalla -->
  <text x="200" y="575" text-anchor="middle" font-size="10" fill="#9CA3AF">Toca un ícono para abrirlo</text>
  <text x="200" y="592" text-anchor="middle" font-size="10" fill="#9CA3AF">Las notificaciones aparecen solas</text>
</svg>