<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="400" height="700" fill="#0F172A"/>
  <rect x="44" y="46" width="320" height="620" rx="32" fill="#000000" opacity="0.4"/>
  <rect x="42" y="44" width="320" height="620" rx="32" fill="#000000" opacity="0.25"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="#1F2937"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="none" stroke="#111827" stroke-width="2"/>
  <rect x="52" y="52" width="296" height="596" rx="20" fill="#000000"/>
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#FFFFFF"/>
  <rect x="170" y="42" width="60" height="5" rx="2.5" fill="#374151"/>
  <circle cx="245" cy="44.5" r="3.5" fill="#111827"/>
  <circle cx="245" cy="44.5" r="1.5" fill="#1E3A8A"/>
  <rect x="170" y="640" width="60" height="4" rx="2" fill="#4B5563"/>
  <rect x="38" y="170" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="38" y="210" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="360" y="190" width="2" height="50" rx="1" fill="#374151"/>

  <!-- ===== STATUS BAR (layout corregido) ===== -->
  <text x="68" y="80" font-size="12" font-weight="700" fill="#1F2937">Viernes 20:15</text>
  <text x="200" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">640 pts</text>
  <rect x="256" y="72" width="3" height="6" fill="#1F2937"/>
  <rect x="261" y="69" width="3" height="9" fill="#1F2937"/>
  <rect x="266" y="66" width="3" height="12" fill="#1F2937"/>
  <rect x="271" y="63" width="3" height="15" fill="#E5E7EB"/>
  <rect x="284" y="66" width="22" height="10" rx="2" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="286" y="68" width="17" height="6" rx="1" fill="#10B981"/>
  <rect x="306" y="69" width="2" height="4" fill="#1F2937"/>

  <!-- ===== CERTIFICADO (fondo) ===== -->
  <!-- Marco con doble línea dorada -->
  <rect x="62" y="95" width="276" height="480" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <rect x="68" y="101" width="264" height="468" rx="8" fill="none" stroke="#F59E0B" stroke-width="1"/>

  <!-- Sello / corona -->
  <circle cx="200" cy="145" r="34" fill="#F59E0B"/>
  <circle cx="200" cy="145" r="28" fill="#FBBF24"/>
  <circle cx="200" cy="145" r="22" fill="#FFFFFF"/>
  <path d="M 190 145 L 194 138 L 200 142 L 206 138 L 210 145 L 207 154 L 193 154 Z" fill="#F59E0B"/>

  <!-- Título certificado -->
  <text x="200" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E" letter-spacing="2">CERTIFICADO</text>
  <text x="200" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Ciudadano Digital</text>
  <text x="200" y="243" text-anchor="middle" font-size="10" fill="#6B7280">otorgado a</text>

  <!-- Nombre -->
  <text x="200" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#1E40AF">Camilo</text>
  <line x1="120" y1="282" x2="280" y2="282" stroke="#D97706" stroke-width="1"/>

  <!-- Puntaje -->
  <text x="200" y="305" text-anchor="middle" font-size="11" fill="#6B7280">por completar la semana</text>
  <text x="200" y="322" text-anchor="middle" font-size="11" fill="#6B7280">con un puntaje de</text>
  <text x="200" y="352" text-anchor="middle" font-size="26" font-weight="700" fill="#10B981">640 / 700</text>
  <text x="200" y="368" text-anchor="middle" font-size="10" fill="#065F46">91 % · Sobresaliente</text>

  <line x1="90" y1="384" x2="310" y2="384" stroke="#FCD34D" stroke-width="1"/>

  <!-- ===== ESTADÍSTICAS ===== -->
  <text x="90" y="404" font-size="10" font-weight="700" fill="#92400E">TU SEMANA EN NÚMEROS</text>

  <!-- Stats en 3 columnas -->
  <text x="105" y="428" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">32</text>
  <text x="105" y="443" text-anchor="middle" font-size="9" fill="#6B7280">mensajes</text>

  <text x="200" y="428" text-anchor="middle" font-size="18" font-weight="700" fill="#10B981">28</text>
  <text x="200" y="443" text-anchor="middle" font-size="9" fill="#6B7280">aciertos</text>

  <text x="295" y="428" text-anchor="middle" font-size="18" font-weight="700" fill="#DC2626">4</text>
  <text x="295" y="443" text-anchor="middle" font-size="9" fill="#6B7280">errores</text>

  <line x1="90" y1="458" x2="310" y2="458" stroke="#FCD34D" stroke-width="1"/>

  <!-- Insignias -->
  <text x="90" y="480" font-size="10" font-weight="700" fill="#92400E">INSIGNIAS DE LA SEMANA</text>

  <!-- Día L -->
  <circle cx="110" cy="508" r="14" fill="#F59E0B"/>
  <text x="110" y="513" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">L</text>

  <!-- Día M -->
  <circle cx="145" cy="508" r="14" fill="#F59E0B"/>
  <text x="145" y="513" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">M</text>

  <!-- Día X -->
  <circle cx="180" cy="508" r="14" fill="#F59E0B"/>
  <text x="180" y="513" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">X</text>

  <!-- Día J -->
  <circle cx="215" cy="508" r="14" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="215" y="513" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">J</text>

  <!-- Día V -->
  <circle cx="250" cy="508" r="14" fill="#F59E0B"/>
  <text x="250" y="513" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">V</text>

  <text x="280" y="512" font-size="9" fill="#6B7280">4 de 5</text>

  <line x1="90" y1="536" x2="310" y2="536" stroke="#FCD34D" stroke-width="1"/>

  <!-- Firma -->
  <text x="200" y="558" text-anchor="middle" font-size="9" font-style="italic" fill="#92400E">"La seguridad empieza por detenerse</text>
  <text x="200" y="572" text-anchor="middle" font-size="9" font-style="italic" fill="#92400E">antes de hacer clic."</text>

  <!-- ===== BOTONES ===== -->
  <!-- Volver al menú (primario) -->
  <rect x="68" y="590" width="264" height="44" rx="8" fill="#2563EB"/>
  <text x="200" y="617" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Volver al menú principal</text>

  <!-- Revisar aprendizajes (secundario) -->
  <rect x="68" y="642" width="264" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="200" y="664" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">📖 Revisar mis 7 aprendizajes</text>
</svg>