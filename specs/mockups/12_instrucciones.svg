<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="400" height="700" fill="#0F172A"/>
  <rect x="44" y="46" width="320" height="620" rx="32" fill="#000000" opacity="0.4"/>
  <rect x="42" y="44" width="320" height="620" rx="32" fill="#000000" opacity="0.25"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="#1F2937"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="none" stroke="#111827" stroke-width="2"/>
  <rect x="52" y="52" width="296" height="596" rx="20" fill="#000000"/>
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#F9FAFB"/>
  <rect x="170" y="42" width="60" height="5" rx="2.5" fill="#374151"/>
  <circle cx="245" cy="44.5" r="3.5" fill="#111827"/>
  <circle cx="245" cy="44.5" r="1.5" fill="#1E3A8A"/>
  <rect x="170" y="640" width="60" height="4" rx="2" fill="#4B5563"/>
  <rect x="38" y="170" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="38" y="210" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="360" y="190" width="2" height="50" rx="1" fill="#374151"/>

  <!-- ===== STATUS BAR (layout corregido) ===== -->
  <text x="68" y="80" font-size="12" font-weight="700" fill="#1F2937">10:42</text>
  <text x="200" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">— pts</text>
  <rect x="256" y="72" width="3" height="6" fill="#1F2937"/>
  <rect x="261" y="69" width="3" height="9" fill="#1F2937"/>
  <rect x="266" y="66" width="3" height="12" fill="#1F2937"/>
  <rect x="271" y="63" width="3" height="15" fill="#E5E7EB"/>
  <rect x="284" y="66" width="22" height="10" rx="2" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="286" y="68" width="17" height="6" rx="1" fill="#10B981"/>
  <rect x="306" y="69" width="2" height="4" fill="#1F2937"/>

  <!-- ===== HEADER ===== -->
  <path d="M 78 108 L 70 116 L 78 124" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="120" font-size="12" font-weight="700" fill="#2563EB">Volver</text>

  <text x="200" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">Cómo jugar</text>
  <text x="200" y="158" text-anchor="middle" font-size="10" fill="#6B7280">Todo lo que necesitas saber en 1 minuto</text>

  <line x1="54" y1="172" x2="346" y2="172" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ===== INTRO ===== -->
  <text x="68" y="196" font-size="11" fill="#374151">Eres Camilo. Durante una semana</text>
  <text x="68" y="212" font-size="11" fill="#374151">recibirás mensajes reales y falsos.</text>
  <text x="68" y="228" font-size="11" fill="#374151">Investiga antes de decidir. Cada</text>
  <text x="68" y="244" font-size="11" fill="#374151">clic tiene consecuencias.</text>

  <!-- ===== SECCIÓN: 5 ACCIONES ===== -->
  <text x="68" y="272" font-size="10" font-weight="700" fill="#6B7280">TUS 5 ACCIONES</text>

  <!-- Confiar -->
  <rect x="68" y="282" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="86" cy="303" r="10" fill="#10B981"/>
  <path d="M 82 303 L 85 306 L 91 299" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="300" font-size="11" font-weight="700" fill="#1F2937">Confiar</text>
  <text x="104" y="314" font-size="9" fill="#6B7280">Solo si es real</text>

  <!-- Verificar -->
  <rect x="204" y="282" width="130" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <circle cx="222" cy="303" r="10" fill="#2563EB"/>
  <circle cx="222" cy="303" r="4" fill="#FFFFFF"/>
  <line x1="228" y1="309" x2="232" y2="313" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="240" y="300" font-size="11" font-weight="700" fill="#1E40AF">Verificar</text>
  <text x="240" y="314" font-size="9" fill="#1E40AF">Siempre es seguro</text>

  <!-- Ignorar -->
  <rect x="68" y="332" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="86" cy="353" r="10" fill="#6B7280"/>
  <path d="M 80 353 Q 86 348 92 353 Q 86 358 80 353 Z" fill="#FFFFFF"/>
  <circle cx="86" cy="353" r="2" fill="#6B7280"/>
  <text x="104" y="350" font-size="11" font-weight="700" fill="#1F2937">Ignorar</text>
  <text x="104" y="364" font-size="9" fill="#6B7280">Spam sin amenaza</text>

  <!-- Bloquear -->
  <rect x="204" y="332" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="222" cy="353" r="10" fill="#EF4444"/>
  <line x1="218" y1="349" x2="226" y2="357" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="226" y1="349" x2="218" y2="357" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="240" y="350" font-size="11" font-weight="700" fill="#1F2937">Bloquear</text>
  <text x="240" y="364" font-size="9" fill="#6B7280">Cortar el contacto</text>

  <!-- Reportar -->
  <rect x="68" y="382" width="266" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="86" cy="403" r="10" fill="#7C3AED"/>
  <path d="M 82 397 L 82 409 M 82 397 L 90 397 L 92 400 L 90 403 L 82 403" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="400" font-size="11" font-weight="700" fill="#1F2937">Reportar</text>
  <text x="104" y="414" font-size="9" fill="#6B7280">La denuncia tiene valor +10 pts</text>

  <!-- ===== SECCIÓN: HERRAMIENTAS ===== -->
  <text x="68" y="450" font-size="10" font-weight="700" fill="#6B7280">3 HERRAMIENTAS (GRATIS, ANTES DE DECIDIR)</text>

  <text x="68" y="474" font-size="11" fill="#1F2937">🔍  Remitente — ¿quién te escribe?</text>
  <text x="68" y="492" font-size="11" fill="#1F2937">🔗  Enlace — ¿a dónde te lleva?</text>
  <text x="68" y="510" font-size="11" fill="#1F2937">📞  Contactos — ¿coincide con quién dice ser?</text>

  <text x="68" y="532" font-size="9" fill="#6B7280" font-style="italic">Cada herramienta usada = +5 pts extra</text>

  <!-- ===== SECCIÓN: RECURSOS ===== -->
  <text x="68" y="558" font-size="10" font-weight="700" fill="#6B7280">TUS 3 RECURSOS · CUALQUIERA EN 0 = FIN DEL NIVEL</text>

  <rect x="68" y="568" width="80" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="108" y="586" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">Privacidad</text>
  <text x="108" y="602" text-anchor="middle" font-size="16">🔒</text>

  <rect x="158" y="568" width="80" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="198" y="586" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Saldo</text>
  <text x="198" y="602" text-anchor="middle" font-size="16">💵</text>

  <rect x="248" y="568" width="86" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="291" y="586" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">Reputación</text>
  <text x="291" y="602" text-anchor="middle" font-size="16">⭐</text>

  <!-- ===== MENÚ MIS APRENDIZAJES (destacado) ===== -->
  <rect x="68" y="622" width="264" height="16" rx="4" fill="#ECFDF5"/>
  <text x="200" y="634" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">📖 Ver mis aprendizajes (7 consejos guardados)</text>
</svg>