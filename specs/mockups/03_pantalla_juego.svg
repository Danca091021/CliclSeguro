<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Fondo de la "mesa" -->
  <rect width="400" height="700" fill="#0F172A"/>

  <!-- Sombra del teléfono -->
  <rect x="44" y="46" width="320" height="620" rx="32" fill="#000000" opacity="0.4"/>
  <rect x="42" y="44" width="320" height="620" rx="32" fill="#000000" opacity="0.25"/>

  <!-- Cuerpo del teléfono -->
  <rect x="40" y="40" width="320" height="620" rx="32" fill="#1F2937"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="none" stroke="#111827" stroke-width="2"/>

  <!-- Bisel interno -->
  <rect x="52" y="52" width="296" height="596" rx="20" fill="#000000"/>

  <!-- Pantalla -->
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#FFFFFF"/>

  <!-- Altavoz / cámara -->
  <rect x="170" y="42" width="60" height="5" rx="2.5" fill="#374151"/>
  <circle cx="245" cy="44.5" r="3.5" fill="#111827"/>
  <circle cx="245" cy="44.5" r="1.5" fill="#1E3A8A"/>

  <!-- Indicador home -->
  <rect x="170" y="640" width="60" height="4" rx="2" fill="#4B5563"/>

  <!-- Botones laterales -->
  <rect x="38" y="170" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="38" y="210" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="360" y="190" width="2" height="50" rx="1" fill="#374151"/>

  <!-- ============ CONTENIDO DE LA PANTALLA ============ -->

  <!-- Status bar interno con hora, señal, batería, puntos -->
  <text x="68" y="80" font-size="12" font-weight="700" fill="#1F2937">Miércoles 10:42</text>
  <text x="270" y="80" text-anchor="end" font-size="11" font-weight="700" fill="#6B7280">45 pts</text>
  <!-- Icono señal -->
  <rect x="286" y="72" width="3" height="6" fill="#1F2937"/>
  <rect x="291" y="69" width="3" height="9" fill="#1F2937"/>
  <rect x="296" y="66" width="3" height="12" fill="#1F2937"/>
  <rect x="301" y="63" width="3" height="15" fill="#E5E7EB"/>
  <!-- Icono batería -->
  <rect x="314" y="66" width="22" height="10" rx="2" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="316" y="68" width="17" height="6" rx="1" fill="#10B981"/>
  <rect x="336" y="69" width="2" height="4" fill="#1F2937"/>

  <!-- Divider -->
  <line x1="54" y1="92" x2="346" y2="92" stroke="#E5E7EB" stroke-width="1"/>

  <!-- HUD: 3 barras -->
  <text x="68" y="115" font-size="11" fill="#1F2937">Privacidad 100</text>
  <rect x="180" y="107" width="160" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="180" y="107" width="160" height="8" rx="4" fill="#10B981"/>

  <text x="68" y="135" font-size="11" fill="#1F2937">Saldo $500.000</text>
  <rect x="180" y="127" width="160" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="180" y="127" width="160" height="8" rx="4" fill="#2563EB"/>

  <text x="68" y="155" font-size="11" fill="#1F2937">Reputación 100</text>
  <rect x="180" y="147" width="160" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="180" y="147" width="160" height="8" rx="4" fill="#10B981"/>

  <line x1="54" y1="170" x2="346" y2="170" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Remitente (con ícono de WhatsApp ligeramente distinto) -->
  <circle cx="78" cy="198" r="14" fill="#25D366"/>
  <!-- Detalle del teléfono dentro del ícono (forma diferente al oficial) -->
  <path d="M 72 198 Q 72 191 78 191 Q 84 191 84 198 Q 84 205 78 205 L 73 205 Z" fill="#FFFFFF"/>
  <circle cx="78" cy="198" r="2" fill="#25D366"/>
  
  <text x="100" y="194" font-size="13" font-weight="700" fill="#1F2937">Soporte WhatsApp</text>
  <text x="100" y="210" font-size="10" fill="#6B7280">+1 555 013 2290 · no está en contactos</text>

  <!-- Timer -->
  <rect x="292" y="184" width="48" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="316" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">00:17</text>

  <line x1="54" y1="225" x2="346" y2="225" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Burbuja del mensaje -->
  <rect x="68" y="240" width="264" height="90" rx="14" fill="#F3F4F6"/>
  <text x="82" y="262" font-size="12" fill="#1F2937">Detectamos un inicio de sesión</text>
  <text x="82" y="279" font-size="12" fill="#1F2937">desde otro dispositivo. Envía el</text>
  <text x="82" y="296" font-size="12" fill="#1F2937">código de 6 dígitos que recibiste</text>
  <text x="82" y="315" font-size="12" font-weight="700" fill="#1F2937">para proteger tu cuenta AHORA.</text>

  <!-- Etiqueta herramientas -->
  <text x="68" y="360" font-size="10" font-weight="700" fill="#6B7280">HERRAMIENTAS DE DETECTIVE</text>

  <!-- Herramientas (3 botones) -->
  <rect x="68" y="368" width="82" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="109" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Remitente</text>

  <rect x="158" y="368" width="82" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="199" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Enlace</text>

  <rect x="248" y="368" width="82" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="289" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Contactos</text>

  <!-- Pregunta -->
  <text x="68" y="430" font-size="13" font-weight="700" fill="#1F2937">¿Qué hace Camilo?</text>

  <!-- Acciones fila 1: Confiar / Verificar (destacado) / Ignorar -->
  <rect x="68" y="442" width="82" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="109" y="467" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Confiar</text>

  <rect x="158" y="442" width="82" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="199" y="467" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Verificar</text>

  <rect x="248" y="442" width="82" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="289" y="467" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Ignorar</text>

  <!-- Acciones fila 2: Bloquear / Reportar -->
  <rect x="68" y="492" width="127" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="131" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Bloquear</text>

  <rect x="203" y="492" width="127" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="266" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Reportar</text>

  <!-- Footer -->
  <text x="200" y="565" text-anchor="middle" font-size="10" fill="#9CA3AF">Inspecciona antes de decidir (+5 pts)</text>
  <text x="200" y="582" text-anchor="middle" font-size="10" fill="#9CA3AF">Verificar siempre es seguro</text>
</svg>