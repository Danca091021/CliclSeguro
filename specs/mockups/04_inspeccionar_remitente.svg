<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Fondo mesa -->
  <rect width="400" height="700" fill="#0F172A"/>

  <!-- Sombra -->
  <rect x="44" y="46" width="320" height="620" rx="32" fill="#000000" opacity="0.4"/>
  <rect x="42" y="44" width="320" height="620" rx="32" fill="#000000" opacity="0.25"/>

  <!-- Cuerpo -->
  <rect x="40" y="40" width="320" height="620" rx="32" fill="#1F2937"/>
  <rect x="40" y="40" width="320" height="620" rx="32" fill="none" stroke="#111827" stroke-width="2"/>

  <!-- Bisel -->
  <rect x="52" y="52" width="296" height="596" rx="20" fill="#000000"/>

  <!-- Pantalla -->
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#FFFFFF"/>

  <!-- Altavoz / cámara -->
  <rect x="170" y="42" width="60" height="5" rx="2.5" fill="#374151"/>
  <circle cx="245" cy="44.5" r="3.5" fill="#111827"/>
  <circle cx="245" cy="44.5" r="1.5" fill="#1E3A8A"/>

  <!-- Home indicator -->
  <rect x="170" y="640" width="60" height="4" rx="2" fill="#4B5563"/>

  <!-- Botones laterales -->
  <rect x="38" y="170" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="38" y="210" width="2" height="30" rx="1" fill="#374151"/>
  <rect x="360" y="190" width="2" height="50" rx="1" fill="#374151"/>

  <!-- ===== CONTENIDO FONDO (atenuado) ===== -->
  <g opacity="0.35">
    <!-- Status bar -->
    <text x="68" y="80" font-size="12" font-weight="700" fill="#1F2937">Miércoles 10:42</text>
    <text x="310" y="80" text-anchor="end" font-size="11" font-weight="700" fill="#6B7280">45 pts</text>

    <!-- HUD -->
    <text x="68" y="115" font-size="11" fill="#1F2937">Privacidad 100</text>
    <rect x="180" y="107" width="160" height="8" rx="4" fill="#10B981"/>

    <text x="68" y="135" font-size="11" fill="#1F2937">Saldo $500.000</text>
    <rect x="180" y="127" width="160" height="8" rx="4" fill="#2563EB"/>

    <text x="68" y="155" font-size="11" fill="#1F2937">Reputación 100</text>
    <rect x="180" y="147" width="160" height="8" rx="4" fill="#10B981"/>

    <!-- Remitente -->
    <circle cx="78" cy="198" r="14" fill="#25D366"/>
    <text x="100" y="194" font-size="13" font-weight="700" fill="#1F2937">Soporte WhatsApp</text>
    <text x="100" y="210" font-size="10" fill="#6B7280">+1 555 013 2290</text>

    <!-- Burbuja -->
    <rect x="68" y="240" width="264" height="80" rx="14" fill="#F3F4F6"/>
    <text x="82" y="262" font-size="12" fill="#1F2937">Detectamos un inicio de sesión</text>
    <text x="82" y="280" font-size="12" fill="#1F2937">desde otro dispositivo. Envía el</text>
    <text x="82" y="298" font-size="12" fill="#1F2937">código de 6 dígitos.</text>
  </g>

  <!-- Overlay oscuro -->
  <rect x="54" y="54" width="292" height="592" rx="18" fill="#000000" opacity="0.55"/>

  <!-- ===== MODAL ===== -->
  <rect x="65" y="100" width="270" height="510" rx="16" fill="#FFFFFF"/>

  <!-- Header modal -->
  <text x="85" y="132" font-size="16" font-weight="700" fill="#1F2937">Información del remitente</text>
  <!-- Botón X -->
  <circle cx="313" cy="126" r="12" fill="#F3F4F6"/>
  <line x1="308" y1="121" x2="318" y2="131" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <line x1="318" y1="121" x2="308" y2="131" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>

  <line x1="85" y1="152" x2="315" y2="152" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Avatar grande (icono WhatsApp simplificado, imita al oficial) -->
  <circle cx="200" cy="212" r="42" fill="#25D366"/>
  <path d="M 182 222 Q 182 196 200 196 Q 218 196 218 222 Q 218 234 205 234 L 190 234 Z" fill="#FFFFFF"/>
  <circle cx="200" cy="212" r="4" fill="#25D366"/>

  <!-- Nombre y número -->
  <text x="200" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Soporte WhatsApp</text>
  <text x="200" y="300" text-anchor="middle" font-size="12" fill="#6B7280">+1 555 013 2290</text>

  <line x1="85" y1="318" x2="315" y2="318" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Info rows -->
  <!-- 1. En contactos -->
  <text x="88" y="342" font-size="12" fill="#6B7280">En contactos</text>
  <circle cx="212" cy="338" r="7" fill="#FEE2E2"/>
  <line x1="208" y1="334" x2="216" y2="342" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="216" y1="334" x2="208" y2="342" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <text x="225" y="342" font-size="12" font-weight="700" fill="#EF4444">No</text>

  <!-- 2. Cuenta creada -->
  <text x="88" y="372" font-size="12" fill="#6B7280">Cuenta creada</text>
  <polygon points="212,364 220,378 204,378" fill="#F59E0B"/>
  <text x="211" y="376" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">!</text>
  <text x="225" y="372" font-size="12" font-weight="700" fill="#92400E">Hace 2 días</text>

  <!-- 3. Reportes -->
  <text x="88" y="402" font-size="12" fill="#6B7280">Reportado por</text>
  <polygon points="212,394 220,408 204,408" fill="#F59E0B"/>
  <text x="211" y="406" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">!</text>
  <text x="225" y="402" font-size="12" font-weight="700" fill="#92400E">14 usuarios</text>

  <!-- 4. Verificado -->
  <text x="88" y="432" font-size="12" fill="#6B7280">Verificado</text>
  <circle cx="212" cy="428" r="7" fill="#FEE2E2"/>
  <line x1="208" y1="424" x2="216" y2="432" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="216" y1="424" x2="208" y2="432" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <text x="225" y="432" font-size="12" font-weight="700" fill="#EF4444">No</text>

  <line x1="85" y1="450" x2="315" y2="450" stroke="#E5E7EB" stroke-width="1"/>

  <!-- PISTA destacada -->
  <rect x="85" y="462" width="230" height="92" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>

  <polygon points="102,478 112,496 92,496" fill="#F59E0B"/>
  <text x="102" y="493" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">!</text>
  <text x="122" y="490" font-size="11" font-weight="700" fill="#92400E">PISTA</text>

  <text x="97" y="512" font-size="10" fill="#78350F">El soporte oficial de WhatsApp</text>
  <text x="97" y="526" font-size="10" fill="#78350F">no usa números internacionales</text>
  <text x="97" y="540" font-size="10" fill="#78350F">ni cuentas nuevas. Desconfía.</text>

  <!-- Botón Entendido -->
  <rect x="85" y="568" width="230" height="42" rx="8" fill="#2563EB"/>
  <text x="200" y="594" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Entendido</text>
</svg>